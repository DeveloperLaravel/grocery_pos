name: grocery_pos
description: Offline-first grocery POS starter using Clean Architecture, BLoC, Freezed, Injectable, GetIt and fpdart.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter 
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  get_it: ^8.2.0
  injectable: ^2.5.1
  fpdart: ^1.1.1
  drift: ^2.28.1
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  mobile_scanner: ^7.0.1
  intl: ^0.20.2
  pdf: ^3.13.0
  esc_pos_utils_plus: ^2.0.4
  drift_flutter: ^0.2.8
  printing: ^5.15.0
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  googleapis: ^16.0.0
  package_info_plus: ^8.3.1
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.6.0
  freezed: ^3.2.0
  json_serializable: ^6.10.0
  injectable_generator: ^2.8.1
  drift_dev: ^2.28.1
flutter:
  uses-material-design: true
